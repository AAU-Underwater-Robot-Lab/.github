name: Synchronize GitLab mirror

on:
  workflow_dispatch:

  schedule:
    # Run once every hour at minute 17
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize GitLab repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Public GitLab source repository
      GITLAB_REPOSITORY: https://gitlab.com/GITLAB_GROUP/GITLAB_REPOSITORY.git

      # Separate GitHub destination repository
      GITHUB_REPOSITORY: https://github.com/GITHUB_OWNER/GITHUB_REPOSITORY.git

      # Fine grained GitHub token stored as an Actions secret
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

    steps:
      - name: Clone GitLab and push to GitHub
        shell: bash
        run: |
          set -euo pipefail

          MIRROR_DIRECTORY="${RUNNER_TEMP}/gitlab-mirror.git"
          ASKPASS_SCRIPT="${RUNNER_TEMP}/github-askpass.sh"

          if [[ -z "${MIRROR_TOKEN:-}" ]]; then
            echo "The MIRROR_TOKEN repository secret is missing."
            exit 1
          fi

          rm -rf "${MIRROR_DIRECTORY}"

          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          prompt="${1:-}"

          case "${prompt}" in
            *Username*)
              printf '%s\n' "x-access-token"
              ;;
            *Password*)
              printf '%s\n' "${MIRROR_TOKEN}"
              ;;
            *)
              printf 'Unexpected Git credential prompt: %s\n' "${prompt}" >&2
              exit 1
              ;;
          esac
          EOF

          chmod 700 "${ASKPASS_SCRIPT}"

          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          echo "Cloning public GitLab repository"

          git clone \
            --mirror \
            "${GITLAB_REPOSITORY}" \
            "${MIRROR_DIRECTORY}"

          echo "Pushing mirror to GitHub"

          git \
            -C "${MIRROR_DIRECTORY}" \
            push \
            --mirror \
            "${GITHUB_REPOSITORY}"

          echo "Repository synchronization completed"
